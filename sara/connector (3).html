<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
  </head>
  <body>
    <script>
      window.TrelloPowerUp.initialize({
        'board-buttons': function(t, options) {
          return [{
            icon: 'https://cdn-icons-png.flaticon.com/512/2618/2618245.png',
            text: '⚔️ Boss Fight',
            callback: function(t) {
              return t.modal({
                url: './index.html',
                fullscreen: true,
                title: 'Adventures RPG'
              });
            }
          }];
        }
      });
    </script>
  </body>
</html>
